# Values come from the .env file next to this file (see .env.example).
# They are listed under `environment` (shared by both services) instead of using `env_file`, so every
# setting the services use is visible in one place.
x-environment: &environment
  APP_ENVIRONMENT: production
  APP_SECRET_KEY: ${APP_SECRET_KEY:?set APP_SECRET_KEY in .env}
  APP_ALLOWED_HOSTS: ${APP_ALLOWED_HOSTS:-localhost,127.0.0.1}
  APP_CSRF_TRUSTED_ORIGINS: ${APP_CSRF_TRUSTED_ORIGINS:-}
  APP_SECURE_COOKIES: ${APP_SECURE_COOKIES:-true}
  APP_TIME_ZONE: ${APP_TIME_ZONE:-Europe/Berlin}
  APP_LOG_LEVEL: ${APP_LOG_LEVEL:-info}
  APP_LEXWARE_API_KEY: ${APP_LEXWARE_API_KEY:-}
  APP_BACKUP_DIR: /backups
  FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
  UVICORN_WORKERS: ${UVICORN_WORKERS:-1}
  DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-}
  DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-}
  DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-}

# Shared by both services: same image, settings, data and hardening.
# The image is the published release (see .github/workflows/build.yaml). Pin LEXTRACKER_VERSION
# (e.g. 0.4.0 or 0.4) in .env to stay on a version; the default follows the newest release.
# To build from source instead, use dev.compose.yaml.
x-service: &service
  image: ghcr.io/maki-it/lextracker:${LEXTRACKER_VERSION:-latest}
  restart: unless-stopped
  init: true
  environment: *environment
  volumes:
    - lextracker-data:/data
    - lextracker-backups:/backups
  # The app writes only to /data, /backups and /tmp.
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  app:
    <<: *service
    container_name: lextracker
    # Set APP_PORT=127.0.0.1:8000 when a reverse proxy on the same host is the only way in.
    ports:
      - "${APP_PORT:-8000}:8000"
    stop_grace_period: 30s
    # The image's entrypoint runs the migrations and creates the admin account before uvicorn
    # starts. If one of them fails, the container exits and the app does not start.

  # Runs recurring jobs: the automatic customer import, the invoice sync, the daily database
  # backup, weekly reports and reminders, all set on the settings page. It also sends the queued
  # e-mails, so without it no password reset or login link arrives.
  scheduler:
    <<: *service
    container_name: lextracker-scheduler
    command: ["python", "manage.py", "run_scheduler"]
    # The scheduler touches this file on every check, once a minute.
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/tmp/lextracker-scheduler.heartbeat') > 300)"]
      interval: 60s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      # Starts once the app answers, so the entrypoint has migrated the database.
      app:
        condition: service_healthy

volumes:
  lextracker-data:
  lextracker-backups:
