<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ subject }}</title>
</head>
<body style="margin:0;padding:24px 12px;background:#f4f4f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#18181b;font-size:15px;line-height:1.5">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;margin:0 auto">
    <tr><td style="padding:0 4px 16px;font-weight:600;font-size:16px;color:#4f46e5">{% block brand %}LexTracker{% endblock %}</td></tr>
    <tr>
      <td style="background:#ffffff;border:1px solid #e4e4e7;border-radius:12px;padding:24px">
        {% block content %}{% endblock %}
      </td>
    </tr>
    <tr><td style="padding:16px 4px 0;font-size:12px;color:#71717a">{% block footer %}Diese E-Mail hat LexTracker automatisch verschickt.{% endblock %}</td></tr>
  </table>
</body>
</html>
