{% load i18n %}{# The number of due reminders next to the sidebar link. With `oob`, the bell sends it along to replace the old one. #}
<span id="nav-reminders-count"{% if oob %} hx-swap-oob="true"{% endif %}>{% if count %}<span class="nav-count nav-count-primary" title="{% trans 'Fällige Erinnerungen' %}">{{ count }}</span>{% endif %}</span>
