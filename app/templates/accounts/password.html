{% extends "base.html" %}
{% block title %}Passwort ändern · LexTracker{% endblock %}
{% block content %}
<h1>Passwort ändern</h1>
<form method="post" class="card flex max-w-2xl flex-col gap-4">
  {% csrf_token %}
  {% include "core/_form_fields.html" %}
  <div class="flex gap-2">
    <button type="submit" class="btn btn-primary">Passwort ändern</button>
    <a href="{% url 'account:settings' %}" class="btn btn-ghost">Abbrechen</a>
  </div>
</form>
{% endblock %}
