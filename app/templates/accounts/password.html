{% extends layout %}
{% block title %}Passwort ändern · LexTracker{% endblock %}
{% block content %}
<div>
  <p class="breadcrumb"><a href="{% url 'account:settings' %}?tab=sicherheit">Konto</a></p>
  <h1>Passwort ändern</h1>
</div>
<form method="post" action="{{ request.get_full_path }}" class="card flex max-w-2xl flex-col gap-4">
  {% csrf_token %}
  {% include "core/_form_fields.html" %}
  <div class="flex gap-2 border-t border-line pt-4">
    <button type="submit" class="btn btn-primary">Passwort ändern</button>
    <a href="{% url 'account:settings' %}?tab=sicherheit" class="btn btn-ghost">Abbrechen</a>
  </div>
</form>
{% endblock %}
