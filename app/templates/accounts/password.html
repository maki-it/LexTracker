{% extends layout %}
{% load i18n %}
{% block title %}{% trans "Passwort ändern" %} · {{ brand.name }}{% endblock %}
{% block content %}
<div>
  <p class="breadcrumb"><a href="{% url 'account:settings' %}?tab=security">{% trans "Konto" %}</a></p>
  <h1>{% trans "Passwort ändern" %}</h1>
</div>
<form method="post" action="{{ request.get_full_path }}" class="card flex max-w-2xl flex-col gap-4">
  {% csrf_token %}
  {% include "core/_form_fields.html" %}
  <div class="flex gap-2 border-t border-line pt-4">
    <button type="submit" class="btn btn-primary">{% trans "Passwort ändern" %}</button>
    <a href="{% url 'account:settings' %}?tab=security" class="btn btn-ghost">{% trans "Abbrechen" %}</a>
  </div>
</form>
{% endblock %}
