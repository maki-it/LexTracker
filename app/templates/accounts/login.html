{% extends "base.html" %}
{% block title %}Anmelden · LexTracker{% endblock %}
{% block content %}
<div class="flex justify-center pt-16">
  <form method="post" class="card bg-base-100 shadow w-full max-w-sm">
    <div class="card-body gap-4">
      <h1 class="card-title text-2xl">Anmelden</h1>
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      {% if error %}<div role="alert" class="alert alert-error">{{ error }}</div>{% endif %}
      <label class="flex flex-col gap-1">
        <span>{{ form.username.label }}</span>
        <input type="text" name="username" value="{{ form.username.value|default:'' }}" class="input w-full" autocomplete="username" required autofocus>
      </label>
      <label class="flex flex-col gap-1">
        <span>{{ form.password.label }}</span>
        <input type="password" name="password" class="input w-full" autocomplete="current-password" required>
      </label>
      <button type="submit" class="btn btn-primary">Anmelden</button>
    </div>
  </form>
</div>
{% endblock %}
