{% extends "base.html" %}
{% block title %}Anmelden · LexTracker{% endblock %}
{% block public_content %}
<div class="flex w-full max-w-sm flex-col gap-6">
  <div class="flex items-center justify-center gap-2.5 text-lg font-semibold">
    <span class="flex size-8 items-center justify-center rounded-lg bg-primary font-bold text-on-primary">L</span>
    LexTracker
  </div>
  <form method="post" class="card flex flex-col gap-4 p-6">
    <h1 class="text-lg">Anmelden</h1>
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    {% for message in messages %}<div role="alert" class="alert{% if message.tags %} alert-{{ message.tags }}{% endif %}">{{ message }}</div>{% endfor %}
    {% if error %}<div role="alert" class="alert alert-error">{{ error }}</div>{% endif %}
    <label class="field">
      <span>{{ form.username.label }}</span>
      <input type="text" name="username" value="{{ form.username.value|default:'' }}" class="input" autocomplete="username" required autofocus>
    </label>
    <label class="field">
      <span>{{ form.password.label }}</span>
      <input type="password" name="password" class="input" autocomplete="current-password" required>
    </label>
    <button type="submit" class="btn btn-primary mt-1">Anmelden</button>
  </form>
</div>
{% endblock %}
