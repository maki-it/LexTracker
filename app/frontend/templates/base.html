{% load static %}
{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="en" data-theme="night">
	<head>
    <title>{% block title %}LexTracker{% endblock %}</title>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="icon" href="{% static 'icons/icon.png' %}" type="image/x-icon">
    {% tailwind_preload_css %}
		{% tailwind_css %}
    {% block head_extra %}{% endblock %}
	</head>
  <body class="h-screen flex flex-col">

  <div class="flex">
    <!-- Sidebar -->
    <aside class="hidden 2xl:flex w-48 h-screen p-4 flex-col">
      {% include 'partials/sidebar.html' %}
    </aside>

    <!-- Navbar -->
    <div class="flex-1 flex flex-col">
      <header class="w-full p-2 h-12">
        <nav class="flex justify-end md:justify-end items-center">
          <div class="flex items-center">
            <button class="btn btn-ghost btn-sm">Profile</button>
            <button class="btn btn-ghost btn-sm">Logout</button>
          </div>
        </nav>
      </header>

      <main class="flex-1 bg-gray-100 2xl:rounded-tl-lg scrollbar">
        <div class="bg-white p-3 lg:p-4 rounded-lg shadow-md h-[calc(100vh-9rem)] 2xl:h-[calc(100vh-3rem)] overflow-x-auto">
        {% block content %}No Content{% endblock %}
        </div>
      </main>

      <footer>
        {% include 'partials/footer.html' %}
      </footer>

    </div>
  </div>

  </body>

</html>
