{% load static %}
<form id="form_project"
      hx-ext="response-targets"
  {% if project %}
      hx-post="{% url 'projects:update_project' project.id %}"
  {% else %}
      hx-post="{% url 'projects:create_project' %}"
  {% endif %}
      hx-target="#errors"
      hx-target-400="#errors">
  <div id="errors"></div>
  {% csrf_token %}
  {% if project %}
    <input type="hidden" name="id" value="{{ project.id }}">
  {% endif %}
  <div class="grid grid-cols-1 md:grid-cols-2 gap-2 md:gap-4">
    <div>
      <label class="form-control w-full">
        <div class="label">
          <span class="label-text text-base-100">{{ form.customer.label }}</span>
        </div>
        <select name="customer" id="id_customer" class="select" required>
          {% for customer in customers %}
            {% if project.customer == customer %}
              <option value="{{ customer.id }}" selected>{{ customer }}</option>
            {% else %}
              <option value="{{ customer.id }}">{{ customer }}</option>
            {% endif %}
          {% empty %}
            <option disabled>No customers available</option>
          {% endfor %}
        </select>
      </label>
    </div>

    <div>
      <label class="form-control">
        <div class="label">
          <span class="label-text text-base-100">{{ form.title.label }}</span>
        </div>
        <input type="text" name="title" id="id_title" class="input" required {% if project %}value="{{ project.title }}"{% endif %}>
      </label>
    </div>

    <div class="md:row-start-2 grid md:grid-flow-col md:grid-cols-2 gap-2 md:gap-4 2xl:grid-cols-3">
      <div class="w-fit md:row-start-1">
        <div>
          <div class="label">
            <span class="label-text text-base-100">{{ form.start_date.label }}</span>
          </div>
          <input type="date" name="start_date" id="id_start_date"
                 class="input input-md w-full" required
                 value="{% if project and action != 'duplicate' %}{{ project.start_date|date:"Y-m-d" }}{% else %}{% now "Y-m-d" %}{% endif %}">
        </div>
      </div>

      <div class="w-fit md:row-start-1">
        <div>
          <div class="label">
            <span class="label-text text-base-100">{{ form.end_date.label }}</span>
          </div>
          <input type="date" name="end_date" id="id_end_date" class="input input-md w-full" required {% if project and action != 'duplicate' %}value="{{ project.end_date|date:"Y-m-d" }}"{% endif %}>
        </div>
      </div>

      <div class="lg:row-start-1">
        <label class="form-control">
          <div class="label">
            <span class="label-text text-base-100">{{ form.categories.label }}</span>
          </div>
          <select name="categories" id="id_categories" class="select" multiple required>
            {% for category in categories %}
              {% if project and category in project.categories.all %}
                <option value="{{ category.id }}" selected>{{ category }}</option>
              {% else %}
                <option value="{{ category.id }}">{{ category }}</option>
              {% endif %}
            {% empty %}
              <option disabled>No categories available</option>
            {% endfor %}
          </select>
        </label>
      </div>

      <div class="form-control h-fit w-fit md:row-start-2 md:col-start-1">
        <label class="label cursor-pointer">
          <input type="checkbox" name="is_archived" id="id_is_archived" class="checkbox checkbox-secondary no-animation"
            {% if project %}
              {% if project.is_archived %}
                 checked="checked"
              {% endif %}
            {% endif %}>
          <span class="label-text text-base-100 ml-2">{{ form.is_archived.label }}</span>
        </label>
      </div>
    </div>

    <div class="md:row-start-2">
      <div class="label">
        <span class="label-text text-base-100">{{ form.description.label }}</span>
      </div>
      <textarea name="description" id="id_description" class="textarea textarea-md w-full">{% if project and action != 'duplicate' %}{{ project.description }}{% endif %}</textarea>
    </div>

    <div class="md:row-start-3">
      {# TODO: Close update form after successful submit  #}
      <button
        id="id_submit" class="btn btn-primary"
        hx-get="#table"
        hx-trigger="submit">
        {% if project and action != 'duplicate' %}
          <img src="{% static 'icons/check.svg' %}" class="h-6 invert" alt="Checkmark">
          <span class="invert">Save</span>
        {% else %}
          <img src="{% static 'icons/plus.svg' %}" class="h-6 invert" alt="Add/Plus Sign">
          <span class="invert">Create</span>
        {% endif %}
      </button>

      {% if project and action != 'duplicate' %}
        <button
          id="id_clear_form" class="btn btn-secondary"
          hx-get="{% url 'frontend:create_project_form' %}"
          hx-trigger="click"
          hx-target="#add_project_form"
          hx-swap="innerHTML">
          <img src="{% static 'icons/x-mark.svg' %}" class="h-6 invert" alt="X Icon">
          <span class="invert">Cancel</span>
        </button>
      {% endif %}
    </div>

  </div>
</form>


<script>
  function initializeForm() {
    document.getElementById('form_project').addEventListener('htmx:afterSwap', function(event) {
      document.getElementById('id_title').value = '';
      document.getElementById('id_description').value = '';
    });

    document.addEventListener('htmx:afterSwap', function (event) {
      if (event.detail.target.id === 'add_project_form') {
        document.getElementById('add_project').scrollIntoView({behavior: 'smooth'});
      } else if (event.detail.target.id === 'settings_modal_content') {
        htmx.trigger('#table', 'refresh-table');
      }
    });

    const start_date = document.getElementById('id_start_date');
    const end_date = document.getElementById('id_end_date');

    end_date.min = start_date.value;

    start_date.addEventListener('change', function() {
      end_date.min = start_date.value;
    });
  }

  initializeForm();

  // Reinitialize form after HTMX content swap
  document.body.addEventListener('htmx:afterSwap', function(event) {
    if (event.target.id === 'form_project') {
      initializeForm();
    }
  });
</script>
