{% load static %}
{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="en" data-theme="night">
	<head>
    <title>Login • LexTracker</title>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="icon" href="{% static 'icons/clock.svg' %}" type="image/x-icon">
    {% tailwind_preload_css %}
		{% tailwind_css %}
    <style>
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .login-card {
        animation: fadeIn 0.5s ease-out;
      }
    </style>
	</head>
  <body class="h-screen w-screen flex items-center justify-center bg-gradient-to-br from-base-300 via-base-200 to-base-300 overflow-hidden">
    <!-- Background decoration -->
    <div class="absolute inset-0 overflow-hidden pointer-events-none">
      <div class="absolute top-0 left-0 w-96 h-96 bg-primary/5 rounded-full blur-3xl -translate-x-1/2 -translate-y-1/2"></div>
      <div class="absolute bottom-0 right-0 w-96 h-96 bg-secondary/5 rounded-full blur-3xl translate-x-1/2 translate-y-1/2"></div>
    </div>

    <!-- Login Card -->
    <div class="login-card card w-96 bg-base-200 shadow-2xl border border-base-300 relative z-10">
      <div class="card-body p-8">
        <!-- Logo -->
        <div class="flex justify-center mb-4">
          <div class="relative">
            <div class="absolute inset-0 bg-primary/20 rounded-full blur-lg animate-pulse"></div>
            <div class="relative w-12 h-12 flex items-center justify-center bg-gradient-to-br from-primary to-secondary rounded-full shadow-lg">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-primary-content" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
            </div>
          </div>
        </div>

        <!-- Title -->
        <div class="text-center mb-4">
          <h1 class="text-xl font-bold text-base-content mb-0.5">
            Welcome back
          </h1>
          <p class="text-xs text-base-content/60">Sign in to LexTracker</p>
        </div>

        <!-- Error Messages -->
        {% if messages %}
          {% for message in messages %}
            <div class="alert alert-error shadow-md mb-3 py-2 text-xs">
              <svg xmlns="http://www.w3.org/2000/svg" class="stroke-current flex-shrink-0 h-4 w-4" fill="none" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
              <span>{{ message }}</span>
            </div>
          {% endfor %}
        {% endif %}

        <!-- Login Form -->
        <form method="post" class="space-y-3">
          {% csrf_token %}

          <div class="form-control">
            <label class="label pb-0.5 pt-0" for="username">
              <span class="label-text text-base-content/80 text-xs font-medium">Username</span>
            </label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-2.5 flex items-center pointer-events-none">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-base-content/40" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                </svg>
              </div>
              <input
                type="text"
                id="username"
                name="username"
                placeholder="Username"
                class="input input-bordered input-sm w-full pl-8 bg-base-100 text-base-content focus:bg-base-100 focus:border-primary transition-colors text-sm"
                required
                autofocus
              />
            </div>
          </div>

          <div class="form-control">
            <label class="label pb-0.5 pt-0" for="password">
              <span class="label-text text-base-content/80 text-xs font-medium">Password</span>
            </label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-2.5 flex items-center pointer-events-none">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-base-content/40" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                </svg>
              </div>
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Password"
                class="input input-bordered input-sm w-full pl-8 bg-base-100 text-base-content focus:bg-base-100 focus:border-primary transition-colors text-sm"
                required
              />
            </div>
          </div>

          <div class="form-control mt-4">
            <button type="submit" class="btn btn-primary btn-sm w-full gap-2 shadow-md hover:shadow-lg transition-all">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" />
              </svg>
              Sign In
            </button>
          </div>
        </form>

        <!-- Footer -->
        <div class="text-center mt-4 pt-4 border-t border-base-300">
          <p class="text-[10px] text-base-content/50">
            LexTracker © 2026
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
