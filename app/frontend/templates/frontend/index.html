{% extends 'base.html' %}
{% load static %}

{% block title %}Dashboard{% endblock %}

{% block head_extra %}
  <script src="{% static 'js/htmx/htmx.min.js' %}"></script>
  <script src="{% static 'js/htmx/htmx-response-targets.js' %}" defer></script>
{% endblock %}

{% block content %}
  <div class="">
    <h1 class="text-4xl font-bold text-center">Welcome to LexTracker</h1>
    <p class="text-lg text-center">Your project time tracker</p>
    <form>
      {% csrf_token %}
      <button type="submit" hx-post="{% url 'lexoffice:sync_customers' %}" hx-trigger="click" class="btn mt-4">Synchronize Customers</button>
    </form>
  </div>
{% endblock %}
