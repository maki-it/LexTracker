{% extends 'base.html' %}
{% load static %}

{% block title %}Dashboard{% endblock %}

{% block head_extra %}
  <script src="{% static 'js/htmx/htmx.min.js' %}"></script>
{% endblock %}

{% block content %}
  <div class="bg-white p-4 rounded-lg shadow-md">
    <div>
      {{ form.non_field_errors }}
      {% for field in form %}
        {{ field.errors }}
      {% endfor %}
    </div>

    <form id="form_activity" method="post" hx-post="{% url 'frontend:time_tracker' %}" hx-trigger="submit">
      {% csrf_token %}
      <div class="grid grid-cols-1 gap-4 md:grid-cols-3">

        <div>

          <div>
            <div class="label">
              <span class="label-text text-base-100">Start</span>
              <a id="id_started_at_now" class="label-text text-base-100 hover:cursor-pointer">Now</a>
            </div>
            <input type="datetime-local" name="started_at" id="id_started_at" class="input input-bordered" required>
          </div>

          <div>
            <div class="label">
              <span class="label-text text-base-100">End</span>
              <a id="id_ended_at_now" class="label-text text-base-100 hover:cursor-pointer">Now</a>
            </div>
            <input type="datetime-local" name="ended_at" id="id_ended_at" class="input input-bordered" required>
          </div>

        </div>

        <div>
          <label class="form-control w-full lg:w-[36rem]">
            <div class="label">
              <span class="label-text text-base-100">{{ form.project.label }}</span>
            </div>
            <select name="project" id="id_project" class="select" required
              hx-get="{% url 'projects:get_categories' %}"
              hx-target="#id_category"
              hx-swap="innerHTML"
              hx-trigger="change, load"
              >
              {% for project in projects %}
                <option value="{{ project.id }}">{{ project.title }} ({{ project.customer }})</option>
              {% empty %}
                <option disabled>No projects available</option>
              {% endfor %}
            </select>
          </label>
        </div>

        <div>

          <label class="form-control w-full">
            <div class="label">
              <span class="label-text text-base-100">Category</span>
            </div>
            <select name="category" id="id_category" class="select" required></select>
          </label>
        </div>

        <div>
          <div class="label">
            <span class="label-text text-base-100">Notes</span>
          </div>
          <textarea name="notes" id="id_notes" cols="40" rows="1" class="textarea textarea-bordered"></textarea>
        </div>

        <div class="form-control">
          <label class="label cursor-pointer">
          <input type="checkbox" name="is_chargeable" id="id_is_chargeable" class="checkbox checkbox-primary" checked="checked">
            <span class="label-text text-base-100">Chargeable</span>
          </label>
        </div>

        <div>
          <button type="submit" id="id_submit" class="btn btn-primary">
            <img src="{% static 'icons/play.svg' %}" class="w-5 h-5 invert" alt="Start Time Tracking">
          </button>
        </div>

      </div>
    </form>
  </div>

  <script>
  // After submit, clear the notes field
  document.getElementById('form_activity').addEventListener('htmx:afterSwap', function(event) {
    document.getElementById('id_notes').value = '';
  });

  function toLocalISOString(date) {
    const localDate = new Date(date - date.getTimezoneOffset() * 60000); //offset in milliseconds. Credit https://stackoverflow.com/questions/10830357/javascript-toisostring-ignores-timezone-offset

    // Optionally remove second/millisecond if needed
    localDate.setSeconds(null);
    localDate.setMilliseconds(null);
    return localDate.toISOString().slice(0, -1);
  }

  const started_at = document.getElementById('id_started_at')
  const ended_at = document.getElementById('id_ended_at')
  started_at.value = toLocalISOString(new Date());

  document.getElementById('id_started_at_now').addEventListener('click', function(event) {
    document.getElementById('id_started_at').value = toLocalISOString(new Date());
  });

  document.getElementById('id_ended_at_now').addEventListener('click', function(event) {
    document.getElementById('id_ended_at').value = toLocalISOString(new Date());
  });
  </script>

{% endblock %}
