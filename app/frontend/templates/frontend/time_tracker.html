{% extends 'base.html' %}
{% load static %}

{% block title %}Dashboard{% endblock %}

{% block head_extra %}
  <script src="{% static 'js/htmx/htmx.min.js' %}"></script>
  <script src="{% static 'js/htmx/htmx-response-targets.js' %}" defer></script>
{% endblock %}

{% block content %}

  <details id="add_activity" class="collapse collapse-arrow border mb-4" open>
    <summary id="add_activity_title" class="collapse-title text-lg font-medium text-base-100 bg-gray-100">Track Activity</summary>
    <div id="add_activity_form" class="collapse-content"
      hx-get="{% url 'frontend:activity_form' %}"
      hx-trigger="load, clear-form from:body"
      hx-swap="innerHTML">
    </div>
  </details>

  {# FIXME: Table causes overflow on small screens #}
  <div id="table_activities" hx-get="{% url 'projects:get_activities' %}" hx-trigger="activities-updated from:body, load" class="overflow-auto"></div>

{% endblock %}
