name: Release Image
run-name: Build container image ${{ inputs.tag }}

# Called by release.yaml for every new release. Run it by hand to rebuild the image of an existing tag.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build, e.g. lextracker-v0.2.0
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, e.g. lextracker-v0.2.0
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Log in to the Container registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # release-please names the tag after the package, e.g. lextracker-v0.2.0. The semver
      # patterns below only understand the part from the "v" on.
      - name: Get the version from the tag
        id: version
        run: |
          version=$(echo "$TAG" | sed -E 's/^[A-Za-z0-9_.]*-(v[0-9])/\1/')
          echo "$version" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+' || { echo "No version in tag $TAG" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ inputs.tag }}

      # The tag is checked out, so this is the commit of the release, not the one that triggered the workflow.
      - name: Get the commit and the build date
        id: build
        run: |
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Extract metadata for the Docker image
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          # The event is not a tag push, so the version is passed in by hand and `latest` is set explicitly.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.version }},enable=${{ !startsWith(steps.version.outputs.version, 'v0.') }}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: |
            linux/amd64
            linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.build.outputs.commit }}
            BUILD_DATE=${{ steps.build.outputs.date }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false # Fix for unknown/unknown image build
          # Own scope, so the CI build and the release build do not overwrite each other's cache.
          cache-from: type=gha,scope=release
          cache-to: type=gha,scope=release,mode=max
