name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Check for missing migrations
        run: uv run app/manage.py makemigrations --check --dry-run
        env:
          APP_ENVIRONMENT: development

      - name: Install gettext
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gettext

      - name: Check that the translations are up to date
        working-directory: app
        run: |
          uv run manage.py makemessages -l en --no-location --no-obsolete -i static -e html,txt,py
          git diff -I'^"POT-Creation-Date' --exit-code -- locale
        env:
          APP_ENVIRONMENT: development

      - name: Compile translations
        working-directory: app
        run: uv run manage.py compilemessages
        env:
          APP_ENVIRONMENT: development

      - name: Test
        run: uv run pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          cache-from: type=gha,scope=ci
          cache-to: type=gha,scope=ci,mode=max
