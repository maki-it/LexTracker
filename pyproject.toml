[project]
name = "lextracker"
version = "0.1.0"
description = "Project time tracker for Lexoffice / Lexware Office"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cookiecutter>=2.6.0",
    "django-debug-toolbar>=6.2.0",
    "django-tailwind[reload]>=3.8.0",
    "django[argon2]>=6.0.1",
    "httpx>=0.28.1",
    "httpx-limiter",
    "pydantic>=2.10.6",
    "pydantic-settings>=2.7.1",
    "uvicorn>=0.34.0",
]

[tool.uv.sources]
httpx-limiter = { git = "https://github.com/Midnighter/httpx-limiter.git", rev = "636cb6e52520018c348d48c4d24734ec07b6ea69" }
