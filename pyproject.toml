[project]
name = "lextracker"
version = "0.12.0"
description = "Zeiterfassung und Projektsteuerung mit Anbindung an Lexware Office"
readme = "README.md"
requires-python = ">=3.15.1"
dependencies = [
    "django[argon2]>=6.1.2",
    "django-htmx>=1.29",
    "django-tailwind-cli>=4.8.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.1",
    "servestatic>=4.4",
    "uvicorn[standard]>=0.54",
    "django-otp>=1.7.5",
    "segno>=1.6.6",
    "brotli>=1.2.1",
    "cryptography>=50.0.2",
    "markdown-it-py>=4.2.0",
    "linkify-it-py>=2.2.0",
    "webauthn>=3.0.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4",
    "pytest-django>=4.14",
    "ruff>=0.17.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
pythonpath = ["app"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers"

[tool.ruff]
line-length = 120
target-version = "py315"
src = ["app", "tests"]
extend-exclude = ["app/*/migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "ASYNC", "SIM", "RUF"]
ignore = ["RUF001", "RUF012"]  # German text uses typographic dashes; Django Meta uses mutable class attributes
