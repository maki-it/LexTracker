services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        BUILDTIME: ${BUILDTIME}
        REVISION: ${REVISION:-local}
    image: lextracker:latest
    container_name: lextracker
    ports:
      - "8000:8000"
    environment:
      # Django settings
      - APP_SECRET_KEY=${APP_SECRET_KEY:-change-me-in-production}
      - APP_ENVIRONMENT=${APP_ENVIRONMENT:-production}
      - APP_LOGLEVEL=${APP_LOGLEVEL:-info}
      - APP_DOMAIN=${APP_DOMAIN:-http://localhost:8000}
      - TZ=${TZ:-UTC}
      # Lexoffice API settings
      - LEXOFFICE_API_TOKEN=${LEXOFFICE_API_TOKEN}
      # Django Superuser (optional - only set if you want to auto-create)
      - DJANGO_SUPERUSER_USERNAME=${DJANGO_SUPERUSER_USERNAME:-}
      - DJANGO_SUPERUSER_PASSWORD=${DJANGO_SUPERUSER_PASSWORD:-}
      - DJANGO_SUPERUSER_EMAIL=${DJANGO_SUPERUSER_EMAIL:-}
    volumes:
      # Persist only the database file
      - db_data:/app/app/data/
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.settimeout(3); s.connect(('127.0.0.1', 8000)); s.close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

# Create named volumes for data persistence
volumes:
  db_data:
    driver: local
