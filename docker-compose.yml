services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        BUILDTIME: ${BUILDTIME}
        REVISION: ${REVISION:-local}
    pull_policy: build
    image: lextracker:latest
    container_name: lextracker
    ports:
      - "80:8080"
    environment:
      # Django settings
      - APP_SECRET_KEY=${APP_SECRET_KEY:-change-me-in-production}
      - APP_ENVIRONMENT=${APP_ENVIRONMENT:-production}
      - APP_LOGLEVEL=${APP_LOGLEVEL:-info}
      - APP_DOMAIN=${APP_DOMAIN:-http://localhost:8080}
      - TZ=${TZ:-UTC}
      # Lexoffice API settings
      - LEXOFFICE_API_TOKEN=${LEXOFFICE_API_TOKEN}
      # Django Superuser (optional - only set if you want to auto-create)
      - DJANGO_SUPERUSER_USERNAME=${DJANGO_SUPERUSER_USERNAME:-}
      - DJANGO_SUPERUSER_PASSWORD=${DJANGO_SUPERUSER_PASSWORD:-}
      - DJANGO_SUPERUSER_EMAIL=${DJANGO_SUPERUSER_EMAIL:-}
    volumes:
      - ./app/db.sqlite3:/app/app/data/db.sqlite3
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.settimeout(3); s.connect(('127.0.0.1', 8080)); s.close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    develop:
      watch:
        # Watch Python files and sync changes
        - action: sync
          path: ./app
          target: /app/app
          ignore:
            - __pycache__/
            - "*.pyc"
            - "*.pyo"
            - "*.pyd"
            - db.sqlite3
            - staticfiles/
            - frontend/static_src/node_modules/

        # Watch Tailwind CSS source files and rebuild on change
        - action: sync+restart
          path: ./app/frontend/static_src/src
          target: /app/frontend/static_src/src

        # Watch Tailwind config files and rebuild on change
        - action: sync+restart
          path: ./app/frontend/static_src/tailwind.config.js
          target: /app/frontend/static_src/tailwind.config.js

        - action: sync+restart
          path: ./app/frontend/static_src/postcss.config.js
          target: /app/frontend/static_src/postcss.config.js

        # Watch Django templates that may contain Tailwind classes
        - action: sync+restart
          path: ./app/frontend/templates
          target: /app/frontend/templates

        # Rebuild container on dependency changes
        - action: rebuild
          path: ./pyproject.toml

        - action: rebuild
          path: ./uv.lock

        - action: rebuild
          path: ./app/frontend/static_src/package.json

